[package]
name = "cf-auth"
version = "0.3.5"
edition = "2024"
description = "Firebase Authentication library for Rust services, with optional Actix-web middleware"
license = "MIT"
authors = ["Alindra Putra"]
repository = "https://github.com/Crypto-Foundation-Dev/cf-auth"

[features]
default = []
actix = ["actix-web"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

# HTTP client
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# JWT Verification
jsonwebtoken = "9"

# Error handling
thiserror = "2.0.17"

# Cache
once_cell = "1.21.3"

# Logging
tracing = "0.1.44"

# Actix
actix-web = { version = "4", optional = true }

# Constant-time comparison (security)
subtle = "2.6"

[dev-dependencies]
tracing-subscriber = "0.3.22"
